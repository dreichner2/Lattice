name: Apply cross-platform integration patch
on:
  push:
    branches: [codex/cross-platform-library]
    paths: [scripts/bootstrap_cross_platform.py]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {ref: codex/cross-platform-library, fetch-depth: 0}
      - run: python3 scripts/bootstrap_cross_platform.py
      - name: Commit generated implementation
        run: |
          chmod +x scripts/build-macos-app.sh open-library.command
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- .gitignore README.md SECURITY.md CONTRIBUTING.md docs native scripts tests windows open-library.command .github/workflows
          git commit -m "feat: add durable cross-platform reading applications"
          git push origin HEAD:codex/cross-platform-library
