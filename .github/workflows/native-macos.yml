name: Native macOS app

on:
  pull_request:
  push:
    branches:
      - main
      - codex/native-epub-reader
      - codex/best-in-class-library
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Python service
        run: |
          python3 -m py_compile scripts/library_ui.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate reader JavaScript
        run: |
          node --check native/ImmersiveEPUB.js
          node --check native/LibraryWorkspace.js
          node --check ui/app.js
          node --test tests/test_immersive_epub.mjs tests/test_library_workspace.mjs

      - name: Validate durable reader store
        run: |
          swiftc -O \
            -framework CryptoKit \
            -lsqlite3 \
            native/ReaderModels.swift \
            native/LibraryIdentity.swift \
            native/ReaderStore.swift \
            tests/ReaderStoreSmoke.swift \
            -o /tmp/reader-store-smoke
          /tmp/reader-store-smoke

      - name: Build and verify CS Library.app
        run: |
          ./scripts/build-macos-app.sh
          test -x "CS Library.app/Contents/MacOS/CS Library"
          test -f "CS Library.app/Contents/Resources/ui/index.html"
          test -f "CS Library.app/Contents/Resources/ui/app.js"
          test -f "CS Library.app/Contents/Resources/server/library_ui.py"
          test -f "CS Library.app/Contents/Resources/ImmersiveEPUB.js"
          test -f "CS Library.app/Contents/Resources/LibraryWorkspace.js"
          /usr/bin/codesign --verify --deep --strict "CS Library.app"
          /usr/bin/plutil -lint "CS Library.app/Contents/Info.plist"

      - name: Package verified app
        run: /usr/bin/ditto -c -k --keepParent "CS Library.app" "CS-Library-macOS.zip"

      - name: Upload verified app
        uses: actions/upload-artifact@v4
        with:
          name: CS-Library-macOS-${{ github.sha }}
          path: CS-Library-macOS.zip
          if-no-files-found: error
          retention-days: 14
