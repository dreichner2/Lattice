name: Native macOS app

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Python service
        run: |
          python3 -m py_compile scripts/library_ui.py scripts/library_vault.py scripts/lattice_tutor.py scripts/study_lab.py scripts/study_python.py scripts/study_kernel.py
          python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate reader JavaScript
        run: |
          node --check native/ImmersiveEPUB.js
          node --check native/LibraryWorkspace.js
          node --check ui/app.js
          node --check ui/tutor.js
          node --check ui/study-lab.js
          node --check ui/pdf-reader.js
          node --check ui/reader-desk.js
          node --check ui/audio-player.js
          node --test tests/*.mjs

      - name: Validate durable reader store
        run: |
          swiftc -O \
            -framework CryptoKit \
            -lsqlite3 \
            native/ReaderModels.swift \
            native/LibraryIdentity.swift \
            native/ReaderStore.swift \
            tests/ReaderStoreSmoke.swift \
            -o /tmp/reader-store-smoke
          /tmp/reader-store-smoke

      - name: Validate macOS update checker
        run: |
          swiftc -O \
            -framework Security \
            native/MacUpdateChecker.swift \
            tests/MacUpdateCheckerSmoke.swift \
            -o /tmp/mac-update-checker-smoke
          /tmp/mac-update-checker-smoke

      - name: Validate direct macOS update installer
        run: |
          swiftc -O \
            -framework CryptoKit \
            -framework Security \
            native/MacUpdateChecker.swift \
            native/MacUpdateInstaller.swift \
            tests/MacUpdateInstallerSmoke.swift \
            -o /tmp/mac-update-installer-smoke
          /tmp/mac-update-installer-smoke

      - name: Validate on-device PDF text recognition
        run: |
          swiftc -O \
            -framework AppKit \
            -framework CryptoKit \
            -framework PDFKit \
            -framework Vision \
            native/LibraryIdentity.swift \
            native/PDFOCRService.swift \
            tests/PDFOCRSmoke.swift \
            -o /tmp/pdf-ocr-smoke
          /tmp/pdf-ocr-smoke

      - name: Build and verify Lattice.app
        run: |
          ./scripts/build-macos-app.sh
          test -x "Lattice.app/Contents/MacOS/Lattice"
          test -f "Lattice.app/Contents/Resources/ui/index.html"
          test -f "Lattice.app/Contents/Resources/ui/app.js"
          test -f "Lattice.app/Contents/Resources/ui/tutor.js"
          test -f "Lattice.app/Contents/Resources/ui/tutor-styles.css"
          test -f "Lattice.app/Contents/Resources/ui/study-lab.html"
          test -f "Lattice.app/Contents/Resources/ui/study-lab.js"
          test -f "Lattice.app/Contents/Resources/ui/vendor/katex/katex.min.js"
          test -f "Lattice.app/Contents/Resources/ui/vendor/katex/fonts/KaTeX_Main-Regular.woff2"
          test -f "Lattice.app/Contents/Resources/ui/pdf-reader.html"
          test -f "Lattice.app/Contents/Resources/ui/pdf-reader-lifecycle.mjs"
          test -f "Lattice.app/Contents/Resources/ui/vendor/pdfjs/build/pdf.min.mjs"
          test -f "Lattice.app/Contents/Resources/server/library_ui.py"
          test -f "Lattice.app/Contents/Resources/server/library_vault.py"
          test -f "Lattice.app/Contents/Resources/server/lattice_tutor.py"
          test -f "Lattice.app/Contents/Resources/server/study_lab.py"
          test -f "Lattice.app/Contents/Resources/server/study_python.py"
          test -f "Lattice.app/Contents/Resources/server/study_kernel.py"
          test -f "Lattice.app/Contents/Resources/server/vendor/pypdf/__init__.py"
          test -f "Lattice.app/Contents/Resources/server/move_library.py"
          test -f "Lattice.app/Contents/Resources/ImmersiveEPUB.js"
          test -f "Lattice.app/Contents/Resources/LibraryWorkspace.js"
          app_python=""
          for candidate in \
            /opt/homebrew/bin/python3 \
            /opt/homebrew/opt/python@3.14/bin/python3 \
            /opt/homebrew/opt/python@3.13/bin/python3 \
            /usr/local/bin/python3 \
            /usr/bin/python3; do
            if test -x "$candidate"; then app_python="$candidate"; break; fi
          done
          test -n "$app_python"
          PYTHONDONTWRITEBYTECODE=1 \
            PYTHONPATH="Lattice.app/Contents/Resources/server" \
            "$app_python" - <<'PY'
          import study_python

          runtime = study_python.StudyPythonRuntime()
          try:
              runtime.run("packaged", "answer = 41")
              result = runtime.run("packaged", "answer + 1")
              output = next(item for item in result["outputs"] if item["type"] == "result")
              if output["text"] != "42":
                  raise SystemExit("packaged macOS Study kernel did not persist state")
          finally:
              runtime.stop_all()
          PY
          /usr/bin/codesign --verify --deep --strict "Lattice.app"
          /usr/bin/plutil -lint "Lattice.app/Contents/Info.plist"

      - name: Package verified app
        run: /usr/bin/ditto -c -k --keepParent "Lattice.app" "Lattice-macOS.zip"

      - name: Upload verified app
        uses: actions/upload-artifact@v4
        with:
          name: Lattice-macOS-${{ github.sha }}
          path: Lattice-macOS.zip
          if-no-files-found: error
          retention-days: 14
