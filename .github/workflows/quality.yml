name: Cross-platform quality

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "native/*.js"
      - "windows/server_bootstrap.py"
      - "ui/**"
      - ".gitignore"
      - ".stignore"
      - "library-layout.json"
      - "library-taxonomy.json"
      - "books/**"
      - "papers/**"
      - "lectures/**"
      - "audio/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "native/*.js"
      - "windows/server_bootstrap.py"
      - "ui/**"
      - ".gitignore"
      - ".stignore"
      - "library-layout.json"
      - "library-taxonomy.json"
      - "books/**"
      - "papers/**"
      - "lectures/**"
      - "audio/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compile Python sources
        run: |
          python -m py_compile scripts/library_ui.py scripts/library_vault.py scripts/lattice_tutor.py scripts/study_lab.py scripts/study_python.py scripts/study_kernel.py scripts/cross_platform_server.py scripts/move_library.py scripts/validate_library_layout.py windows/server_bootstrap.py

      - name: Validate clone and Syncthing layout
        run: |
          python scripts/validate_library_layout.py
          python tests/test_library_layout.py

      - name: Run Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run reader tests
        run: |
          node --check ui/app.js
          node --check ui/tutor.js
          node --check ui/study-lab.js
          node --check ui/pdf-reader.js
          node --check ui/reader-desk.js
          node --check ui/audio-player.js
          node --check native/ImmersiveEPUB.js
          node --check native/LibraryWorkspace.js
          node --check native/SharedReaderState.js
          node --test tests/*.mjs
