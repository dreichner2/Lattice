name: Cross-platform quality

on:
  push:
    branches:
      - codex/cross-platform-library
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "native/*.js"
      - "windows/server_bootstrap.py"
      - "ui/**"
      - ".gitignore"
      - ".stignore"
      - "library-layout.json"
      - "books/**"
      - "papers/**"
      - "lectures/**"
      - ".github/workflows/quality.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "native/*.js"
      - "windows/server_bootstrap.py"
      - "ui/**"
      - ".gitignore"
      - ".stignore"
      - "library-layout.json"
      - "books/**"
      - "papers/**"
      - "lectures/**"
      - ".github/workflows/quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Compile Python sources
        run: |
          python -m py_compile scripts/library_ui.py scripts/cross_platform_server.py scripts/validate_library_layout.py windows/server_bootstrap.py

      - name: Validate clone and Syncthing layout
        run: |
          python scripts/validate_library_layout.py
          python tests/test_library_layout.py

      - name: Run local-server tests
        run: python tests/test_cross_platform_server.py

      - name: Run reader tests
        run: |
          node --check ui/app.js
          node --check native/ImmersiveEPUB.js
          node --check native/LibraryWorkspace.js
          node --check native/SharedReaderState.js
          node --test tests/test_immersive_epub.mjs tests/test_library_workspace.mjs tests/test_reader_state.mjs
