name: Windows desktop app

on:
  push:
    branches:
      - codex/cross-platform-library
    paths:
      - "windows/**"
      - "native/SharedReaderState.js"
      - "native/ImmersiveEPUB.js"
      - "scripts/cross_platform_server.py"
      - "scripts/library_ui.py"
      - "tests/**"
      - ".github/workflows/windows-app.yml"
  pull_request:
    paths:
      - "windows/**"
      - "native/SharedReaderState.js"
      - "native/ImmersiveEPUB.js"
      - "scripts/cross_platform_server.py"
      - "scripts/library_ui.py"
      - "tests/**"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and test portable app
        shell: pwsh
        run: ./windows/build-windows.ps1 -Runtime win-x64

      - name: Verify package
        shell: pwsh
        run: |
          Test-Path "artifacts/CS-Library-Windows-win-x64.zip"
          Test-Path "windows/build/package-win-x64/CS Library.exe"
          Test-Path "windows/build/package-win-x64/Server/CSLibraryServer.exe"
          Test-Path "windows/build/package-win-x64/windows/reader/vendor/pdf.mjs"

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: CS-Library-Windows-win-x64
          path: artifacts/CS-Library-Windows-win-x64.zip
          if-no-files-found: error
