name: Lattice Windows desktop app

on:
  pull_request:
    paths:
      - "windows/**"
      - "native/*.js"
      - "scripts/**"
      - "tests/**"
      - "ui/**"
      - "assets/**"
      - "manifests/**"
      - "metadata/**"
      - ".stignore"
      - "CATALOG.md"
      - "LIBRARY_RULES.md"
      - "README.md"
      - "STUDY_GUIDE.md"
      - "library-layout.json"
      - "library-taxonomy.json"
      - "books/**"
      - "papers/**"
      - "lectures/**"
      - ".github/workflows/windows-app.yml"
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - "native/*.js"
      - "scripts/**"
      - "tests/**"
      - "ui/**"
      - "assets/**"
      - "manifests/**"
      - "metadata/**"
      - ".stignore"
      - "CATALOG.md"
      - "LIBRARY_RULES.md"
      - "README.md"
      - "STUDY_GUIDE.md"
      - "library-layout.json"
      - "library-taxonomy.json"
      - "books/**"
      - "papers/**"
      - "lectures/**"
      - ".github/workflows/windows-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build and test portable app
        shell: pwsh
        run: ./windows/build-windows.ps1 -Runtime win-x64

      - name: Verify package
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/Lattice-Windows-win-x64.zip")) { throw "Archive missing" }
          if (-not (Test-Path "windows/build/package-win-x64/Lattice.exe")) { throw "App missing" }
          if (-not (Test-Path "windows/build/package-win-x64/Lattice.ico")) { throw "Application icon missing" }
          if (-not (Test-Path "windows/build/package-win-x64/Server/LatticeServer.exe")) { throw "Server missing" }
          if (-not (Test-Path "windows/build/package-win-x64/Install Lattice.ps1")) { throw "Installer missing" }
          if (-not (Test-Path "windows/build/package-win-x64/.stignore")) { throw "Syncthing rules missing" }
          if (-not (Test-Path "windows/build/package-win-x64/library-taxonomy.json")) { throw "Taxonomy missing" }
          foreach ($file in @("SharedReaderState.js", "ImmersiveEPUB.js")) {
            if (-not (Test-Path (Join-Path "windows/build/package-win-x64/native" $file))) {
              throw "Bundled native bridge file missing: $file"
            }
          }
          foreach ($file in @("index.html", "app.js", "styles.css", "video-styles.css", "videos.js")) {
            if (-not (Test-Path (Join-Path "windows/build/package-win-x64/ui" $file))) {
              throw "Bundled interface file missing: $file"
            }
          }
          $layout = Get-Content "library-layout.json" -Raw | ConvertFrom-Json
          foreach ($directory in @($layout.content_directories)) {
            $packageDirectory = Join-Path "windows/build/package-win-x64" ([string]$directory)
            if (-not (Test-Path (Join-Path $packageDirectory ".gitkeep"))) {
              throw "Scaffold directory missing: $directory"
            }
          }

      - name: Smoke-test portable installer and embedded icon
        shell: pwsh
        run: |
          $package = (Resolve-Path "windows/build/package-win-x64").Path
          $destination = Join-Path $env:RUNNER_TEMP "lattice-installer-smoke"
          $testAppData = Join-Path $env:RUNNER_TEMP "lattice-installer-appdata"
          $previousAppData = $env:APPDATA
          try {
            $env:APPDATA = $testAppData
            & (Join-Path $package "Install Lattice.ps1") -Destination $destination -NoLaunch
            if (-not (Test-Path (Join-Path $destination "Lattice.exe"))) { throw "Installer did not copy Lattice.exe" }
            if (-not (Test-Path (Join-Path $destination "Lattice.ico"))) { throw "Installer did not copy Lattice.ico" }
            $shortcut = Join-Path $testAppData "Microsoft\Windows\Start Menu\Programs\Lattice.lnk"
            if (-not (Test-Path $shortcut)) { throw "Installer did not create the Lattice shortcut" }
          } finally {
            $env:APPDATA = $previousAppData
          }

      - name: Smoke-test packaged local service
        shell: pwsh
        run: |
          $package = (Resolve-Path "windows/build/package-win-x64").Path
          $libraryRoot = (Resolve-Path ".").Path
          $stdout = Join-Path $env:RUNNER_TEMP "lattice-server.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "lattice-server.stderr.log"
          $state = Join-Path $env:RUNNER_TEMP "lattice-reader-state.sqlite3"
          $listener = [System.Net.Sockets.TcpListener]::new([System.Net.IPAddress]::Loopback, 0)
          $listener.Start()
          $port = ([System.Net.IPEndPoint]$listener.LocalEndpoint).Port
          $listener.Stop()
          $url = "http://127.0.0.1:$port"
          $parent = $null
          $server = $null
          try {
            $parent = Start-Process powershell.exe `
              -ArgumentList @("-NoProfile", "-Command", "Start-Sleep -Seconds 120") `
              -PassThru
            $server = Start-Process (Join-Path $package "Server\LatticeServer.exe") `
              -ArgumentList @(
                "--root", $libraryRoot,
                "--ui-root", (Join-Path $package "ui"),
                "--state-db", $state,
                "--port", $port.ToString(),
                "--parent-pid", $parent.Id.ToString(),
                "--no-browser"
              ) `
              -RedirectStandardOutput $stdout `
              -RedirectStandardError $stderr `
              -PassThru

            $health = $null
            for ($attempt = 0; $attempt -lt 80 -and -not $health; $attempt++) {
              Start-Sleep -Milliseconds 250
              try {
                $health = Invoke-RestMethod "$url/api/health" -TimeoutSec 2
              } catch {
                $health = $null
              }
              $server.Refresh()
              if ($server.HasExited -and -not $health) {
                $detail = if (Test-Path $stderr) { Get-Content $stderr -Raw } else { "" }
                throw "Packaged server exited before readiness: $detail"
              }
            }
            if (-not $health) {
              $output = if (Test-Path $stdout) { [string](Get-Content $stdout -Raw) } else { "" }
              $detail = if (Test-Path $stderr) { [string](Get-Content $stderr -Raw) } else { "" }
              throw "Packaged server did not become healthy. stdout: $output stderr: $detail"
            }
            if ($health.status -ne "ok") { throw "Unexpected health status: $($health.status)" }
            if (-not [string]::Equals(
              [IO.Path]::GetFullPath([string]$health.root),
              [IO.Path]::GetFullPath($libraryRoot),
              [StringComparison]::OrdinalIgnoreCase
            )) { throw "Packaged server selected the wrong library root: $($health.root)" }

            Start-Sleep -Seconds 4
            $parent.Refresh()
            $server.Refresh()
            if ($parent.HasExited) { throw "Parent liveness probe terminated its parent process" }
            if ($server.HasExited) { throw "Packaged server did not remain alive" }
          } finally {
            if ($server) { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }
            if ($parent) { Stop-Process -Id $parent.Id -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Lattice-Windows-win-x64
          path: windows/build/package-win-x64
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
