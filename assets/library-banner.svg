<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">CS Library</title>
  <desc id="description">A curated, verified computer science bookshelf with 47 works and 72 artifacts.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09162f"/>
      <stop offset="0.52" stop-color="#132c59"/>
      <stop offset="1" stop-color="#291d55"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d8ff"/>
      <stop offset="1" stop-color="#a88bff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9cc8ff" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)"/>
  <circle cx="1045" cy="52" r="116" fill="#6d5dfc" opacity="0.13" filter="url(#glow)"/>
  <circle cx="930" cy="282" r="150" fill="#37c8f3" opacity="0.10" filter="url(#glow)"/>

  <g transform="translate(72 67)">
    <rect x="0" y="0" width="10" height="118" rx="5" fill="#55d8ff"/>
    <text x="38" y="58" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="750" letter-spacing="3">CS LIBRARY</text>
    <text x="40" y="100" fill="#c6d8f5" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="21" letter-spacing="0.5">A source-traceable shelf for serious computer science study</text>
  </g>

  <g transform="translate(74 226)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="650">
    <g>
      <rect width="132" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
      <text x="66" y="27" text-anchor="middle" fill="#eaf5ff">47 works</text>
    </g>
    <g transform="translate(148 0)">
      <rect width="166" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
      <text x="83" y="27" text-anchor="middle" fill="#eaf5ff">72 artifacts</text>
    </g>
    <g transform="translate(330 0)">
      <rect width="176" height="42" rx="21" fill="#ffffff" opacity="0.10"/>
      <text x="88" y="27" text-anchor="middle" fill="#eaf5ff">0 duplicates</text>
    </g>
  </g>

  <g transform="translate(866 67)">
    <rect x="0" y="135" width="266" height="14" rx="7" fill="url(#accent)" opacity="0.95"/>
    <rect x="18" y="39" width="30" height="96" rx="4" fill="#55d8ff"/>
    <rect x="54" y="20" width="38" height="115" rx="4" fill="#9cecff"/>
    <rect x="98" y="49" width="29" height="86" rx="4" fill="#648dff"/>
    <rect x="133" y="9" width="40" height="126" rx="4" fill="#a88bff"/>
    <rect x="179" y="31" width="32" height="104" rx="4" fill="#d4c8ff"/>
    <path d="M220 31l29-8 30 108-29 8z" fill="#7d6bf2"/>
    <g fill="#10244b" opacity="0.55">
      <rect x="26" y="53" width="14" height="3" rx="1.5"/>
      <rect x="65" y="37" width="16" height="3" rx="1.5"/>
      <rect x="106" y="62" width="13" height="3" rx="1.5"/>
      <rect x="144" y="26" width="18" height="3" rx="1.5"/>
      <rect x="187" y="48" width="16" height="3" rx="1.5"/>
    </g>
  </g>
</svg>
